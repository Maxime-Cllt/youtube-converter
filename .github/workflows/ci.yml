name: Full Stack CI

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "**.md"
      - ".gitignore"
      - "LICENSE"
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "**.md"
      - ".gitignore"
      - "LICENSE"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
      frontend: ${{ steps.changes.outputs.frontend }}
      general: ${{ steps.changes.outputs.general }}
      gha: ${{ steps.changes.outputs.gha }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check for changes
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            backend:
              - 'src-tauri/**'
              - 'scripts/**'
            frontend:
              - 'src/**'
              - 'public/**'
              - 'package.json'
              - 'bun.lock'
              - 'bun.lockb'
              - 'index.html'
              - 'vite.config.*'
              - 'svelte.config.*'
              - 'tsconfig.json'
              - 'postcss.config.js'
              - 'tailwind.config.*'
            general:
              - '**.md'
              - '.gitignore'
              - 'LICENSE'
              - 'docs/**'
            gha:
              - '.github/**'

  full-stack-test-build:
    name: Full Stack Test & Build
    runs-on: ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.general == 'false' || (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.gha == 'true')

    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true

      - name: Cache Bun store
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock', '**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Cache Cargo & Tauri target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Frontend Dependencies
        run: bun install --frozen-lockfile

      - name: Fetch yt-dlp sidecar binaries
        run: bash scripts/fetch-ytdlp.sh

      - name: Run Rust Unit Tests
        if: needs.changes.outputs.backend == 'true'
        run: |
          cd src-tauri
          cargo test --verbose --all-features --lib

      - name: Type-check & Build Frontend
        run: bun run build

      - name: Build Tauri Application
        run: bun run tauri build --verbose
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
